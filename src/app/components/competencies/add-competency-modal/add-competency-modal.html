<app-dialog
  [open]="isOpen()"
  contentClass="max-w-lg max-h-[90vh] overflow-y-auto"
  (openChange)="closed.emit()">
  <div appDialogHeader>
    <h2 appDialogTitle class="text-indigo-600">إضافة جدارة جديدة</h2>
  </div>

  <div class="space-y-4 py-4">
    <div class="space-y-2">
      <label appLabel>اسم الجدارة</label>
      <input
        appInput
        name="competencyName"
        [(ngModel)]="competencyName"
        placeholder="مثال: التفكير الاستراتيجي" />
    </div>

    <div class="space-y-2">
      <label appLabel>نوع الجدارة</label>
      <app-select
        [value]="competencyType()"
        (valueChange)="competencyType.set($event)">
        <app-select-trigger>
          <app-select-value />
        </app-select-trigger>
        <app-select-content>
          <app-select-item value="core_competency">جدارة أساسية</app-select-item>
          <app-select-item value="general_behavioural_competency">
            جدارة سلوكية عامة
          </app-select-item>
          <app-select-item value="leadership_behavioural_competency">
            جدارة قيادية
          </app-select-item>
          <app-select-item value="technical_competency">
            جدارة تقنية
          </app-select-item>
        </app-select-content>
      </app-select>
    </div>

    <div class="grid grid-cols-2 gap-4">
      <div class="space-y-2">
        <label appLabel>الأولوية (1-5)</label>
        <input
          appInput
          type="number"
          name="priorityScore"
          min="1"
          max="5"
          [ngModel]="priorityScore()"
          (ngModelChange)="priorityScore.set(parseInt($event) || 1)" />
      </div>
      <div class="space-y-2">
        <label appLabel>الوزن %</label>
        <input
          appInput
          type="number"
          name="weight"
          min="1"
          max="100"
          [ngModel]="weight()"
          (ngModelChange)="weight.set(parseFloat($event) || 0)" />
      </div>
    </div>

    <div class="space-y-2">
      <label appLabel>المهارات المطلوبة</label>
      <div class="flex gap-2">
        <input
          appInput
          name="newSkill"
          [(ngModel)]="newSkill"
          placeholder="أضف مهارة..."
          (keydown.enter)="handleAddSkill()" />
        <button
          appButton
          type="button"
          size="icon"
          (click)="handleAddSkill()"
          variant="outline">
          <app-icon name="Plus" class="w-4 h-4" />
        </button>
      </div>
      <div class="flex flex-wrap gap-2 mt-2">
        @for (skill of skills(); track $index; let idx = $index) {
          <div appBadge variant="secondary" class="flex items-center gap-1">
            {{ skill }}
            <app-icon
              name="X"
              class="w-3 h-3 cursor-pointer hover:text-red-500"
              (click)="removeSkill(idx)" />
          </div>
        }
      </div>
    </div>
  </div>

  <div appDialogFooter class="gap-2 sm:justify-start">
    <button
      appButton
      (click)="handleSave()"
      [disabled]="isSaving() || !competencyName()"
      class="bg-indigo-600 hover:bg-indigo-700">
      {{ isSaving() ? 'جاري الإضافة...' : 'إضافة' }}
    </button>
    <button appButton variant="outline" (click)="closed.emit()">إلغاء</button>
  </div>
</app-dialog>
