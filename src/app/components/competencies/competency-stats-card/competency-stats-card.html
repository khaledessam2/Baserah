<div
  class="p-6 rounded-2xl text-white shadow-lg relative overflow-hidden group cursor-pointer hover:-translate-y-1 transition-transform"
  [class]="colorClass()">
  <div
    class="absolute -right-4 -top-4 w-20 h-20 bg-white/10 rounded-full blur-xl group-hover:bg-white/20 transition-colors"></div>
  <h3 class="text-sm font-semibold opacity-90 mb-2 relative z-10">
    {{ label() }}
  </h3>
  <p class="text-3xl font-extrabold relative z-10">{{ count() }}</p>
</div>
