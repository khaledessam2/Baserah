<button
  appButton
  variant="ghost"
  size="icon"
  class="relative rounded-full w-9 h-9 border border-transparent hover:bg-slate-100 dark:hover:bg-slate-800 transition-colors"
  (click)="toggle()">
  <app-icon
    name="Sun"
    class="h-[1.2rem] w-[1.2rem] rotate-0 scale-100 transition-all dark:-rotate-90 dark:scale-0 text-amber-500" />
  <app-icon
    name="Moon"
    class="absolute h-[1.2rem] w-[1.2rem] rotate-90 scale-0 transition-all dark:rotate-0 dark:scale-100 text-indigo-400" />
  <span class="sr-only">Toggle theme</span>
</button>
