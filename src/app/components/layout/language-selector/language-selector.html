<button
  appButton
  variant="ghost"
  size="sm"
  (click)="toggleLanguage()"
  [class]="classes()">
  <app-icon
    name="Languages"
    class="w-4 h-4 text-indigo-600 dark:text-indigo-400" />
  <span class="text-sm font-bold text-slate-700 dark:text-slate-300">
    {{ i18n.language() === 'ar' ? 'English' : 'العربية' }}
  </span>
</button>
