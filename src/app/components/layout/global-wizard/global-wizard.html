@if (visible()) {
  <div class="w-full py-8 mb-8">
    <div class="w-full px-4 md:px-8">
      <div
        class="relative flex items-center justify-between max-w-4xl mx-auto">
        <div
          class="absolute top-1/2 left-0 w-full h-1 bg-muted -translate-y-1/2 rounded-full z-0"></div>

        <div
          class="absolute top-1/2 left-0 h-1 bg-linear-to-r from-primary via-secondary to-primary bg-size-[200%_100%] animate-shimmer -translate-y-1/2 rounded-full z-0 transition-all duration-1000 ease-out"
          [style.width.%]="progressWidth()"></div>

        @for (step of steps; track $index; let index = $index) {
          <div class="relative flex flex-col items-center">
            <div
              class="relative flex items-center justify-center w-10 h-10 md:w-12 md:h-12 rounded-xl transition-all duration-500 z-10 cursor-pointer"
              [class]="markerClass(index)"
              (click)="onStepClick(index)">
              @if (isCompleted(index)) {
                <app-icon
                  name="Check"
                  class="w-5 h-5 md:w-6 md:h-6 animate-in zoom-in-95 duration-300" />
              } @else {
                <app-icon
                  [name]="step.icon"
                  class="w-4 h-4 md:w-5 md:h-5 transition-transform duration-500"
                  [class.scale-110]="isActive(index)" />
              }
            </div>

            <span
              class="absolute -bottom-8 text-xs font-bold whitespace-nowrap transition-all duration-300 hidden md:block"
              [class]="labelClass(index)">
              {{ i18n.t(step.labelKey, step.fallback) }}
            </span>
          </div>
        }
      </div>
    </div> 
  </div>
}
