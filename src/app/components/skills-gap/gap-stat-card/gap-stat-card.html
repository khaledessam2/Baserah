<div
  class="glass-card p-5 rounded-2xl shadow-lg hover:shadow-xl transition-shadow duration-300">
  <div class="flex items-start gap-4">
    <div
      class="p-3 rounded-xl bg-linear-to-br text-white shadow-lg shrink-0"
      [class]="gradient()">
      <app-icon [name]="icon()" [class]="iconClass()" />
    </div>
    <div class="flex-1 min-w-0">
      <p
        class="text-xs font-bold text-slate-500 dark:text-slate-400 uppercase tracking-wide">
        {{ title() }}
      </p>
      <p class="text-3xl font-black mt-1.5 text-slate-900 dark:text-white">
        {{ value() }}
      </p>
      @if (subtitle()) {
        <p
          class="text-[10px] text-slate-400 dark:text-slate-500 mt-1 font-medium">
          {{ subtitle() }}
        </p>
      }
    </div>
  </div>
</div>
