<div [class]="wrapperClass()">
  <button
    type="button"
    (click)="expanded.set(!expanded())"
    class="w-full p-4 flex items-center gap-4 hover:bg-white/30 dark:hover:bg-white/5 transition-colors">
    <div [class]="iconWrapClass()">
      @if (type() === 'tech') {
        <app-icon name="ClipboardCheck" class="w-5 h-5" />
      } @else {
        <app-icon name="UserCheck" class="w-5 h-5" />
      }
    </div>
    <div class="flex-1 min-w-0 text-start">
      <p class="font-bold text-slate-800 dark:text-white text-sm">
        {{ round().label }}
      </p>
      <p class="text-xs text-slate-400 flex items-center gap-1 mt-0.5">
        <app-icon name="CalendarDays" class="w-3 h-3" />
        {{ formattedDate() }}
      </p>
    </div>
    <div class="flex items-center gap-3">
      <div class="text-end">
        <p [class]="scoreClass()">{{ round().overall_score }}%</p>
        <p class="text-[10px] text-slate-400">
          {{ round().correct_answers }}/{{ round().total_questions }}
          {{ correctLabel() }}
        </p>
      </div>
      @if (expanded()) {
        <app-icon name="ChevronUp" class="w-4 h-4 text-slate-400" />
      } @else {
        <app-icon name="ChevronDown" class="w-4 h-4 text-slate-400" />
      }
    </div>
  </button>

  @if (expanded()) {
    <div
      class="px-4 pb-4 space-y-2 border-t border-white/10 dark:border-white/5 pt-3 animate-in slide-in-from-top-2 duration-200">
      @for (c of round().competencies; track $index) {
        <div
          class="p-3 rounded-xl bg-white/40 dark:bg-slate-800/40 border border-white/10 dark:border-white/5">
          <div class="flex items-center justify-between mb-1.5">
            <span
              class="text-xs font-bold text-slate-700 dark:text-slate-200 truncate max-w-[60%]">
              {{ c.competency }}
            </span>
            <div class="flex items-center gap-2">
              <app-gap-badge [severity]="c.severity" />
              <span class="text-[10px] text-slate-400 font-medium">
                {{ c.correct }}/{{ c.total }}
              </span>
            </div>
          </div>
          <div class="flex items-center gap-2">
            <span
              class="text-xs w-10 font-bold text-slate-600 dark:text-slate-300">
              {{ c.score }}%
            </span>
            <div class="flex-1"><app-score-bar [score]="c.score" /></div>
          </div>
        </div>
      }
    </div>
  }
</div>
