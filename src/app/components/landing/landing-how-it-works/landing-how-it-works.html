<section
  class="py-24 px-4 md:px-8 bg-slate-50 dark:bg-slate-900 border-t border-slate-200 dark:border-slate-800">
  <div class="max-w-7xl mx-auto">
    <div class="text-center mb-16">
      <h2
        appReveal
        class="text-3xl md:text-5xl font-bold text-slate-900 dark:text-white mb-4">
        {{ 'landing.how_it_works.title' | t }}
      </h2>
      <div
        appReveal
        class="h-1.5 w-20 bg-blue-600 mx-auto rounded-full"></div>
    </div>

    <div
      class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-12 relative">
      <!-- Connector Line -->
      <div
        class="hidden lg:block absolute top-[40px] left-[10%] right-[10%] h-[2px] bg-slate-200 dark:bg-slate-800 z-0"></div>

      @for (step of steps; track step; let index = $index) {
        <div
          appReveal
          [revealDelay]="index * 0.2"
          class="relative z-10 text-center group">
          <div
            class="w-20 h-20 rounded-full bg-blue-600 text-white text-2xl font-bold flex items-center justify-center mx-auto mb-6 shadow-xl shadow-blue-500/30 border-4 border-slate-50 dark:border-slate-900 group-hover:scale-110 transition-transform">
            {{ index + 1 }}
          </div>
          <h4 class="text-xl font-bold text-slate-900 dark:text-white mb-3">
            {{ step + '.title' | t }}
          </h4>
          <p
            class="text-slate-600 dark:text-slate-400 leading-relaxed px-4">
            {{ step + '.description' | t }}
          </p>
        </div>
      }
    </div>
  </div>
</section>
