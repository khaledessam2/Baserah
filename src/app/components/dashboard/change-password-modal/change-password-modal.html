<app-dialog
  [open]="isOpen()"
  [contentClass]="contentClass()"
  (openChange)="closed.emit()">
  <div appDialogHeader>
    <h2 appDialogTitle class="flex items-center gap-2 text-xl">
      <div class="p-2 bg-amber-100 rounded-lg text-amber-600">
        <app-icon name="Lock" class="w-5 h-5" />
      </div>
      {{ heading() }}
    </h2>
  </div>

  <form (ngSubmit)="handleSubmit()" class="space-y-4 py-4">
    @if (mode() === 'self') {
      <div class="space-y-2">
        <label appLabel for="currentPassword">
          {{ 'auth.current_password' | t: 'Current Password' }}
        </label>
        <input
          appInput
          id="currentPassword"
          type="password"
          name="currentPassword" 
          [(ngModel)]="currentPassword"
          required />
      </div>
    }

    <div class="space-y-2">
      <label appLabel for="newPassword">
        {{ 'auth.new_password' | t: 'New Password' }}
      </label>
      <input
        appInput
        id="newPassword"
        type="password"
        name="newPassword"
        [(ngModel)]="newPassword"
        required />
    </div>

    <div class="space-y-2">
      <label appLabel for="confirmPassword">
        {{ 'auth.confirm_password' | t: 'Confirm Password' }}
      </label>
      <input
        appInput
        id="confirmPassword"
        type="password"
        name="confirmPassword"
        [(ngModel)]="confirmPassword"
        required />
    </div>

    <div class="flex justify-end gap-3 pt-4">
      <button appButton type="button" variant="outline" (click)="closed.emit()">
        {{ 'common.cancel' | t: 'Cancel' }}
      </button>
      <button
        appButton
        type="submit"
        [disabled]="isLoading()"
        class="bg-amber-600 hover:bg-amber-700">
        {{ isLoading() ? 'Processing...' : ('common.save' | t: 'Save') }}
      </button>
    </div>
  </form>
</app-dialog>
