@if (open()) {
  <div
    class="fixed inset-0 z-50 bg-black/80 animate-in fade-in-0"
    (click)="requestClose()"></div>
  <div
    role="dialog"
    aria-modal="true"
    class="fixed left-[50%] top-[50%] z-50 grid w-full max-w-lg translate-x-[-50%] translate-y-[-50%] gap-4 border bg-background p-6 shadow-lg duration-200 animate-in fade-in-0 zoom-in-95 sm:rounded-lg max-h-[90vh] overflow-y-auto"
    [class]="contentClass()"
    (keydown.escape)="requestClose()">
    <ng-content />
    <button
      type="button"
      class="absolute right-4 top-4 rounded-sm opacity-70 ring-offset-background transition-opacity hover:opacity-100 focus:outline-none focus:ring-2 focus:ring-ring focus:ring-offset-2"
      (click)="requestClose()">
      <app-icon name="X" class="h-4 w-4" />
      <span class="sr-only">Close</span>
    </button>
  </div>
}
