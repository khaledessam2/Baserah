@if (tour.isOpen() && currentStep(); as step) {
  <div
    class="fixed inset-0 z-[10000] pointer-events-none overflow-hidden"
    [attr.dir]="isRtl() ? 'rtl' : 'ltr'">
    <!-- SVG Mask for Spotlight -->
    <svg class="absolute inset-0 w-full h-full pointer-events-auto">
      <defs>
        <mask id="spotlight-mask">
          <rect x="0" y="0" width="100%" height="100%" fill="white" />
          @if (targetRect(); as rect) {
            <svg:rect
              class="transition-all duration-300 ease-out"
              [attr.x]="rect.left - 12"
              [attr.y]="rect.top - 12"
              [attr.width]="rect.width + 24"
              [attr.height]="rect.height + 24"
              rx="12"
              fill="black" />
          }
        </mask>
      </defs>
      <rect
        x="0"
        y="0"
        width="100%"
        height="100%"
        fill="rgba(0, 0, 0, 0.75)"
        mask="url(#spotlight-mask)" />
    </svg>

    <!-- Tooltip -->
    <div
      class="absolute bg-white dark:bg-slate-900 p-6 md:p-10 rounded-[30px] md:rounded-[40px] shadow-[0_30px_70px_-10px_rgba(0,0,0,0.4)] border border-slate-200 dark:border-slate-800 w-[480px] max-w-[calc(100vw-40px)] pointer-events-auto min-h-fit transition-[top,left,right,bottom] duration-300 ease-out"
      [style]="tooltipStyles()">
      <div class="flex justify-between items-start mb-6 gap-6">
        <h3
          class="font-extrabold text-2xl md:text-3xl text-slate-900 dark:text-white leading-tight tracking-tight">
          {{ step.title }}
        </h3>
        <button
          type="button"
          (click)="tour.closeTour()"
          class="text-slate-400 hover:text-slate-900 dark:hover:text-white transition-all p-2 hover:bg-slate-100 dark:hover:bg-slate-800 rounded-full">
          <app-icon name="X" [size]="24" />
        </button>
      </div>

      <div
        class="min-h-[80px] md:min-h-[100px] flex flex-col justify-center">
        <p
          class="text-slate-700 dark:text-slate-200 mb-6 md:mb-10 text-base md:text-xl leading-relaxed font-medium">
          {{ step.content }}
        </p>
      </div>

      <div
        class="flex items-center justify-between gap-8 pt-6 border-t border-slate-100 dark:border-slate-800/60">
        <div class="flex gap-1.5 md:gap-2.5 items-center">
          @for (s of tour.steps(); track $index) {
            <div [class]="dotClass($index)"></div>
          }
        </div>

        <div class="flex gap-4 shrink-0">
          @if (currentStepIndex() > 0) {
            <button
              appButton
              variant="outline"
              size="lg"
              (click)="handleBack()"
              class="h-12 px-6 font-semibold border-2 dark:bg-transparent dark:border-slate-700 dark:text-slate-300 hover:dark:bg-slate-800">
              @if (isRtl()) {
                <app-icon name="ArrowRight" [size]="20" class="ml-2" />
              } @else {
                <app-icon name="ArrowLeft" [size]="20" class="mr-2" />
              }
              {{ i18n.t('common.back') }}
            </button>
          }
          <button
            appButton
            size="lg"
            (click)="handleNext()"
            class="h-12 px-8 font-bold shadow-2xl shadow-primary/30 bg-primary hover:bg-primary/90 text-white border-0">
            {{
              isLastStep()
                ? i18n.t('common.finish')
                : i18n.t('common.next')
            }}
            @if (!isLastStep()) {
              @if (isRtl()) {
                <app-icon name="ArrowLeft" [size]="20" class="mr-2" />
              } @else {
                <app-icon name="ArrowRight" [size]="20" class="mr-2" />
              }
            }
          </button>
        </div>
      </div>

      @if (!isMobile()) {
        <div [class]="arrowClass()"></div>
      }
    </div>
  </div>
}
