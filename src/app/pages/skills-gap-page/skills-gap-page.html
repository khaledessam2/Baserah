<div
  [attr.dir]="isRtl() ? 'rtl' : 'ltr'"
  class="container mx-auto px-4 py-6 sm:py-8 max-w-[1400px]">
  <!-- Header -->
  <div class="mb-8">
    <div class="flex items-center gap-4 mb-3">
      <div class="relative">
        <div
          class="absolute inset-0 bg-gradient-to-br from-red-500 via-amber-500 to-emerald-500 rounded-2xl blur-lg opacity-40"></div>
        <div
          class="relative bg-gradient-to-br from-red-500 via-amber-500 to-emerald-500 text-white p-3.5 rounded-2xl shadow-xl">
          <app-icon name="BarChart3" class="w-7 h-7" />
        </div>
      </div>
      <div>
        <h1
          class="text-2xl sm:text-3xl font-black tracking-tight text-slate-900 dark:text-white">
          {{ 'skills_gap.page_title' | t }}
        </h1>
        <p class="text-slate-500 dark:text-slate-400 text-sm mt-0.5">
          {{ 'skills_gap.page_desc' | t }}
        </p>
      </div>
    </div>
  </div>

  <!-- Tabs -->
  <app-tabs
    [value]="activeTab()"
    (valueChange)="activeTab.set($event)"
    [attr.dir]="isRtl() ? 'rtl' : 'ltr'"
    class="space-y-6 block">
    <div class="sticky top-[var(--nav-stuck)] z-30 -mx-4 px-4 py-2">
      <div appTabsList [class]="tabsListClass()">
        @for (tab of tabs; track tab.value) {
          <button appTabsTrigger [value]="tab.value" [class]="triggerClass">
            <span class="inline-flex items-center gap-2">
              <app-icon [name]="tab.icon" class="w-4 h-4 shrink-0" />
              <span>{{ tab.labelKey | t }}</span>
            </span>
          </button>
        }
      </div>
    </div>

    <app-tabs-content value="overview">
      <app-skills-gap-overview-tab [orgName]="orgName()" />
    </app-tabs-content>
    <app-tabs-content value="heatmap">
      <app-skills-gap-heatmap-tab [orgName]="orgName()" />
    </app-tabs-content>
    <app-tabs-content value="role">
      <app-skills-gap-role-tab
        [orgName]="orgName()"
        [jobTitles]="jobTitles()" />
    </app-tabs-content>
    <app-tabs-content value="department">
      <app-skills-gap-department-tab [orgName]="orgName()" />
    </app-tabs-content>
    <app-tabs-content value="employee">
      <app-skills-gap-employee-tab [orgName]="orgName()" />
    </app-tabs-content>
    <app-tabs-content value="risks">
      <app-skills-gap-critical-risks-tab [orgName]="orgName()" />
    </app-tabs-content>
  </app-tabs>
</div>
